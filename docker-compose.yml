services:
    db:
      image: postgres:16-alpine
      environment:
        POSTGRES_DB: ${POSTGRES_DB:?Configurer .env}
        POSTGRES_USER: ${POSTGRES_USER:?Configurer .env}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurer .env}
      ports:
        - "127.0.0.1:15432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
          test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
          interval: 5s
          timeout: 3s
          retries: 5

    redis:
        image: redis:7-alpine
        ports:
          - "127.0.0.1:6379:6379"
        healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 5s
          timeout: 3s
          retries: 5


    adminer:
      image: adminer
      ports:
        - "8081:8080"
      depends_on:
        db:
          condition: service_healthy


volumes:
    pgdata: {}